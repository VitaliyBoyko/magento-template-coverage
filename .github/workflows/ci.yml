name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.12.0', '24', '26']
        browser: [chromium]
        include:
          - node: '24'
            browser: chrome-156
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npx playwright install --with-deps chromium
        if: matrix.browser == 'chromium'
      - name: Install MageLens's pinned Chrome for Testing
        if: matrix.browser == 'chrome-156'
        env:
          CHROME_VERSION: '156.0.8078.80'
          CHROME_SHA256: b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7
        run: |
          npx playwright install-deps chromium
          curl --fail --location --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/mtc-chrome"
          echo "MTC_CHROME_EXECUTABLE_PATH=$RUNNER_TEMP/mtc-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "MTC_CHROME_VERSION=$CHROME_VERSION" >> "$GITHUB_ENV"
      - run: npm run test:playwright
      - run: npm pack --dry-run
